[package]
name = "rl-env"
version = "0.1.0"
edition = "2024"

[dependencies]
rs-engine   = { path = "../rs-engine" }
rs-pack     = { path = "../rs-pack" }
rs-entity   = { path = "../rs-engine/rs-entity" }
rs-vm       = { path = "../rs-engine/rs-vm" }
rs-grid     = { path = "../rs-engine/rs-grid" }
rs-stat     = { path = "../rs-engine/rs-stat" }
rs-util     = { path = "../rs-engine/rs-util" }
rs-protocol = { workspace = true }
tokio       = { version = "1.52", features = ["sync", "rt"] }
once_cell   = "1"
serde       = { version = "1", features = ["derive"] }
ron         = "0.8"

# SPIKE (cache_dump bin) only.
anyhow      = "1"

# tape::record_tutorial_tape re-seats the outbound ISAAC stream after
# accept_login (see tape.rs's doc comment) -- needed by the packet_tape bin,
# so this must be a real dependency, not dev-only (the spike test that
# originally pulled this in as dev-only mirrors it from the test side).
rs-crypto   = { workspace = true }
