[package]
name = "rs-host"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rl-env    = { path = "../rl-env" }
# ★ For player_save::{extract_profile, apply_profile, save_binary, load_binary} --
# the profile save/restore FFI (Task 1). rs-host previously only depended on
# rs-engine sub-crates (rs-grid, rs-vm, rs-entity); this is the first direct
# dependency on rs-engine itself.
rs-engine = { path = "../rs-engine" }
rs-pack   = { path = "../rs-pack" }
rs-grid   = { path = "../rs-engine/rs-grid" }
# ★ For `ScriptPlayer` ONLY -- the trait `host_teleport` reaches the engine's own
# teleport through. It is the same method the content VM's `p_teleport` opcode
# dispatches to. `rs-engine`'s own `EnginePlayer::tele` would be the more direct
# route but `mod active_player` is PRIVATE (`rs-engine/src/lib.rs:5`) and only
# `ActivePlayer` itself is re-exported, so the trait is unreachable from here
# without changing rs-engine's public surface.
rs-vm     = { path = "../rs-engine/rs-vm" }
# ★ For `InteractionTarget` ONLY -- the enum `host_npc_field`'s selectors 10-13
# decode. `Npc::hunt_target` and `Npc::interaction.target` are both
# `Option<InteractionTarget>`, and reading them means MATCHING ON THE VARIANT:
# the variant is what says "this npc is engaging a PLAYER" rather than a ground
# obj, and the payload index means a different numbering scheme in each arm.
# Same path as `rl-env`'s own dependency, so cargo unifies the two into one
# crate rather than compiling a second, incompatible copy of the enum.
rs-entity = { path = "../rs-engine/rs-entity" }
tokio     = { version = "1.52", features = ["sync", "rt"] }

# tests/keepalive.rs only -- it builds a real ISAAC-encoded inbound packet
# (NoTimeout, then MoveGameClick) by hand. `src/lib.rs` itself does no ISAAC
# work (no re-seat needed; see `host_new`'s doc comment), so this is not a
# runtime dependency of the cdylib.
[dev-dependencies]
rs-crypto = { workspace = true }
# tests/profile.rs only -- it hand-crafts a magic-valid, CRC-valid but
# structurally-truncated profile blob (the Critical-finding regression) and
# needs `rs_io::crc::getcrc` to sign it, the same way `save_binary` does.
# Same pattern as `rs-crypto` above: a test-only need for wire-level bytes,
# not a runtime dependency of the cdylib.
rs-io     = { workspace = true }
# tests/gen_changed_profile.rs only -- it builds an inventory directly
# (`Inventory::with_stack_mode`/`.set`) to seed the Task 2b fixture profile.
# `rs-engine` (a real dependency above) re-exports `Player`, not `Inventory`
# itself, so this is a direct workspace dep for the one test that needs it.
rs-inv    = { workspace = true }
